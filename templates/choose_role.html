<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choose Role | Sivdhi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#2563eb,#0f172a);

padding:20px;

}

.box{

width:100%;
max-width:420px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(20px);

border-radius:25px;

padding:35px;

text-align:center;

color:white;

box-shadow:0 15px 40px rgba(0,0,0,.35);

}

.logo{

width:90px;
height:90px;

margin:auto;

border-radius:50%;

background:white;

display:flex;

justify-content:center;
align-items:center;

font-size:40px;

font-weight:bold;

color:#2563eb;

margin-bottom:25px;

}

h2{

margin-bottom:10px;

}

p{

color:#dbeafe;

margin-bottom:30px;

}

.role{

display:block;

width:100%;

padding:18px;

margin-bottom:18px;

border:none;

border-radius:15px;

background:white;

color:#2563eb;

font-size:18px;

font-weight:bold;

text-decoration:none;

transition:.3s;

}

.role:hover{

transform:scale(1.03);

background:#eff6ff;

}

.footer{

margin-top:20px;

font-size:14px;

color:#dbeafe;

}

</style>

</head>

<body>
{% set sivdhi_template_has_flash = False %}
{% include '_shared_alerts.html' %}


<div class="box">

<div class="logo">

S

</div>

<h2>

Choose Your Role

</h2>

<p>

Continue as Worker or Referral Partner

</p>

<a
class="role"
href="/login?role=worker">

👷 Worker

</a>

<a
class="role"
href="/login?role=partner">

🤝 Referral Partner

</a>

<div class="footer">

Sivdhi © 2026

</div>

</div>

</body>

</html>
