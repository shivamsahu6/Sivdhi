plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.sivdhi.mobile'
    compileSdk 36

    // AGP 9 defaults resValues to disabled; both product flavors use resValue for app_name.
    buildFeatures {
        resValues = true
    }

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    flavorDimensions += 'audience'

    productFlavors {
        customer {
            dimension 'audience'
            applicationId 'com.sivdhi.customer'
            manifestPlaceholders = [
                startUrl: 'https://sivdhi.duckdns.org/customer/login'
            ]
            resValue 'string', 'app_name', 'Sivdhi Customer'
        }

        workpartner {
            dimension 'audience'
            applicationId 'com.sivdhi.workpartner'
            manifestPlaceholders = [
                startUrl: 'https://sivdhi.duckdns.org/login'
            ]
            resValue 'string', 'app_name', 'Sivdhi Worker & Partner'
        }
    }

    // Release credentials are supplied only by GitHub Actions Secrets at build time.
    // Never store a keystore or passwords in this repository.
    def releaseStoreFilePath = System.getenv('SIVDHI_RELEASE_STORE_FILE')
    def releaseStorePasswordValue = System.getenv('SIVDHI_RELEASE_STORE_PASSWORD')
    def releaseKeyAliasValue = System.getenv('SIVDHI_RELEASE_KEY_ALIAS')
    def releaseKeyPasswordValue = System.getenv('SIVDHI_RELEASE_KEY_PASSWORD')
    def releaseSigningConfigured = [
        releaseStoreFilePath,
        releaseStorePasswordValue,
        releaseKeyAliasValue,
        releaseKeyPasswordValue
    ].every { it != null && !it.trim().isEmpty() }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFilePath)
                storeType 'PKCS12'
                storePassword releaseStorePasswordValue
                keyAlias releaseKeyAliasValue
                keyPassword releaseKeyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            // Keep the Firebase-registered package name in both build types.
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
}
