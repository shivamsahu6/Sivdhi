name: Build Sivdhi Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-sivdhi-android-apks.yml'

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Customer and Worker Partner APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Sivdhi
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36,build-tools;36.0.0'

      - name: Build both APKs
        working-directory: android-apk
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleCustomerDebug \
            :app:assembleWorkpartnerDebug

      - name: Verify and collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-apk/dist
          CUSTOMER="$(find android-apk/app/build/outputs/apk -path '*/customer/debug/*.apk' -type f | head -n 1)"
          WORKPARTNER="$(find android-apk/app/build/outputs/apk -path '*/workpartner/debug/*.apk' -type f | head -n 1)"
          test -s "$CUSTOMER"
          test -s "$WORKPARTNER"
          cp "$CUSTOMER" android-apk/dist/Sivdhi-Customer.apk
          cp "$WORKPARTNER" android-apk/dist/Sivdhi-Worker-Partner.apk
          sha256sum android-apk/dist/*.apk | tee android-apk/dist/SHA256SUMS.txt
          ls -lh android-apk/dist

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: Sivdhi-Android-APKs
          path: android-apk/dist/*
          if-no-files-found: error
          retention-days: 30
