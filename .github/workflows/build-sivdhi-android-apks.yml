name: Build Sivdhi Customer APK (Fresh)

on:
  push:
    branches:
      - fresh-customer-app
    paths:
      - 'android-customer-fresh/**'
      - '.github/workflows/build-sivdhi-android-apks.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: sivdhi-customer-fresh-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

jobs:
  build-customer:
    name: Build and verify Customer app only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Prepare existing Sivdhi release signing key
        if: env.BUILD_TYPE == 'release'
        shell: bash
        env:
          SIVDHI_RELEASE_KEYSTORE_BASE64: ${{ secrets.SIVDHI_RELEASE_KEYSTORE_BASE64 }}
          SIVDHI_RELEASE_STORE_PASSWORD: ${{ secrets.SIVDHI_RELEASE_STORE_PASSWORD }}
          SIVDHI_RELEASE_KEY_ALIAS: ${{ secrets.SIVDHI_RELEASE_KEY_ALIAS }}
          SIVDHI_RELEASE_KEY_PASSWORD: ${{ secrets.SIVDHI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            SIVDHI_RELEASE_KEYSTORE_BASE64 \
            SIVDHI_RELEASE_STORE_PASSWORD \
            SIVDHI_RELEASE_KEY_ALIAS \
            SIVDHI_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing repository Actions secret: ${secret_name}"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/sivdhi-release.p12"
          printf '%s' "$SIVDHI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$SIVDHI_RELEASE_STORE_PASSWORD" \
            -alias "$SIVDHI_RELEASE_KEY_ALIAS" >/dev/null
          {
            echo "SIVDHI_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "SIVDHI_RELEASE_STORE_PASSWORD=$SIVDHI_RELEASE_STORE_PASSWORD"
            echo "SIVDHI_RELEASE_KEY_ALIAS=$SIVDHI_RELEASE_KEY_ALIAS"
            echo "SIVDHI_RELEASE_KEY_PASSWORD=$SIVDHI_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build fresh Customer APK
        working-directory: android-customer-fresh
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_TYPE" == "release" ]]; then
            gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleDebug
          fi

      - name: Verify APK and package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-customer-fresh/dist
          if [[ "$BUILD_TYPE" == "release" ]]; then
            APK="android-customer-fresh/app/build/outputs/apk/release/app-release.apk"
            AAB="android-customer-fresh/app/build/outputs/bundle/release/app-release.aab"
          else
            APK="android-customer-fresh/app/build/outputs/apk/debug/app-debug.apk"
            AAB="android-customer-fresh/app/build/outputs/bundle/debug/app-debug.aab"
          fi
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" android-customer-fresh/dist/Sivdhi-Customer-Fresh.apk
          cp "$AAB" android-customer-fresh/dist/Sivdhi-Customer-Fresh.aab
          unzip -t android-customer-fresh/dist/Sivdhi-Customer-Fresh.aab >/dev/null
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs android-customer-fresh/dist/Sivdhi-Customer-Fresh.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging android-customer-fresh/dist/Sivdhi-Customer-Fresh.apk | \
            grep -E "^(package:|application-label:)" | head -5
          sha256sum \
            android-customer-fresh/dist/Sivdhi-Customer-Fresh.apk \
            android-customer-fresh/dist/Sivdhi-Customer-Fresh.aab \
            | tee android-customer-fresh/dist/SHA256SUMS.txt
          printf 'Build type: %s\n' "$BUILD_TYPE" > android-customer-fresh/dist/BUILD_TYPE.txt
          cd android-customer-fresh
          zip -qr dist/Sivdhi-Customer-Fresh-Source.zip \
            README.md .gitignore build.gradle settings.gradle gradle.properties \
            gradle gradlew gradlew.bat app

      - name: Upload Customer APK and complete source
        uses: actions/upload-artifact@v4
        with:
          name: Sivdhi-Customer-Fresh-${{ env.BUILD_TYPE }}
          path: |
            android-customer-fresh/dist/Sivdhi-Customer-Fresh.apk
            android-customer-fresh/dist/Sivdhi-Customer-Fresh.aab
            android-customer-fresh/dist/SHA256SUMS.txt
            android-customer-fresh/dist/BUILD_TYPE.txt
            android-customer-fresh/dist/Sivdhi-Customer-Fresh-Source.zip
          if-no-files-found: error
          retention-days: 30
